<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un detalle especial 🌻</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0e13;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .card {
            position: relative;
            z-index: 10;
            width: 88%;
            max-width: 350px;
            padding: 30px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .flower {
            font-size: 65px;
            cursor: pointer;
            margin-bottom: 10px;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .flower:hover { transform: scale(1.1) rotate(5deg); }
        .title {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .subtitle {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .letter {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s ease;
            text-align: left;
            font-size: 13px;
            color: #ddd;
            line-height: 1.6;
        }
        .letter.show {
            max-height: 300px;
            opacity: 1;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,215,0,0.2);
        }
        .petal {
            position: absolute;
            top: -10px;
            color: #ffd700;
            font-size: 14px;
            user-select: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <div class="flower" onclick="toggleMsg()">🌻</div>
        <div class="title">Un Detalle para Ti</div>
        <div class="subtitle">21 de Septiembre</div>
        <button class="btn" id="btn" onclick="toggleMsg()">Ver mensaje ✉️</button>
        
        <div class="letter" id="msg">
            <p style="margin-bottom: 10px;">Sé muy bien lo que platicamos y respeto mucho tu espacio.</p>
            <p style="margin-bottom: 10px;">Aun así, no quería dejar pasar este día sin enviarte un pequeño detalle de flores amarillas para sacarte una sonrisa.</p>
            <p><strong>Sin presiones ni compromisos. Que tengas un bonito día. ✨</strong></p>
        </div>
    </div>

    <script>
        function toggleMsg() {
            var m = document.getElementById('msg');
            var b = document.getElementById('btn');
            if (m.classList.contains('show')) {
                m.classList.remove('show');
                b.innerText = 'Ver mensaje ✉️';
            } else {
                m.classList.add('show');
                b.innerText = 'Cerrar ❌';
            }
        }

        // Lluvia suave de chispas
        for (let i = 0; i < 15; i++) {
            let p = document.createElement('div');
            p.className = 'petal';
            p.innerText = '✨';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 3 + 3) + 's';
            p.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
